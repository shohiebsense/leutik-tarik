name: secret-scan

# A credential file reached origin/main once and stayed for 18 commits. Rotation
# fixed the exposure; this job exists so the next one fails before it merges.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history, not just the tip

      - name: block credential files by name
        run: |
          set -e
          if git ls-files | grep -qiE '(^|/)(\.env|.*\.cred\.md|.*credentials?.*\.md|.*\.pem|.*\.key)$'; then
            echo "::error::credential-shaped file is tracked:"; git ls-files | grep -iE '(^|/)(\.env|.*\.cred\.md|.*credentials?.*\.md|.*\.pem|.*\.key)$'
            exit 1
          fi

      - name: block credential shapes in tracked content
        run: |
          set -e
          # bcrypt hashes, private keys, basic-auth credentials, bearer tokens
          if git grep -nI -E '\$2[aby]\$[0-9]{2}\$|BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|Authorization: Basic [A-Za-z0-9+/=]{16,}|sk-[A-Za-z0-9]{20,}' -- . ':!*.test' ':!*_test.go' ':!go.sum'; then
            echo "::error::a credential-shaped value is tracked; use a secret, not a file"
            exit 1
          fi

      - name: block the old leaked password
        run: |
          set -e
          if git log --all -S"i7sZ8JUhGXKFmiXSjtHU" --oneline | grep -q .; then
            echo "::error::the rotated password is back in history"
            exit 1
          fi
